name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 使用 DEBUG_KEYSTORE_BASE64（與電腦相同的 debug 簽章），新版可直接覆蓋安裝
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using provided debug keystore"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; APK is signed with a new debug key"
          fi

      - name: Build, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - name: Name APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "TuTuCard-v${VERSION}-debug.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs TuTuCard-v${{ steps.apk.outputs.version }}-debug.apk | grep -i sha-256

      - uses: actions/upload-artifact@v4
        with:
          name: TuTuCard-v${{ steps.apk.outputs.version }}-debug
          path: TuTuCard-v${{ steps.apk.outputs.version }}-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: 吐兔卡 v${{ steps.apk.outputs.version }}
          files: TuTuCard-v${{ steps.apk.outputs.version }}-debug.apk
          make_latest: true
